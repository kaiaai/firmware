<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/favicon.png">
<style>
* {
  box-sizing: border-box;
}

html {
  font-family: Arial, Helvetica, sans-serif; 
}

.topnav { 
  overflow: hidden; 
  background-color: #034078;
}

h1 {
  font-size: 1.8rem; 
  color: white;
  padding: 2px 20px;
}

input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  resize: vertical;
}

.sub_input {
  width:50%;
}

label {
  padding: 12px 12px 12px 0;
  display: inline-block;
}

.clickable {
  cursor:pointer;
  color:blue;
}

.clickable:hover {
  cursor:hand;  
  color:#0096FF;
  text-decoration:underline;
}

input[type=submit], input[type=reset], button {
  color: #FEFCFB;
  background-color: #034078;
  text-align: center;
  font-size: 16px;
  margin-right: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover, button:hover {
  background-color: #45a049;
}

button:disabled, button[disabled] {
  border: 1px solid #999999;
  background-color: #cccccc;
  color: #666666;
}
.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

.col-25 {
  float: left;
  width: 25%;
  margin-top: 6px;
}

.col-75 {
  float: left;
  width: 75%;
  margin-top: 6px;
}

/* Clear floats after the columns */
.row::after {
  content: "";
  display: table;
  clear: both;
}

/* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .col-25, .col-75, input[type=submit] {
    width: 100%;
    margin-top: 0;
  }
}
</style>
  <title>Kaia.ai Robot Configurator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script>
fetch("/config.old")
  .then(function(response) {
    if (!response.ok) {
      console.log('Unable to fetch config');  
	} else {
      response.text().then(function(text) {
        //console.log("Here's what I got! \n" + storedText);
	    var x = document.getElementById("restore_config");
	    x.disabled = false;
        var lines = text.split('\n');
		//console.log(lines);
        var config = {};
        for (var idx = 0; idx < lines.length-1;) {
	      param_name = lines[idx++];
	      param_value = lines[idx++];
          //console.log(`${param_name}: ${param_value}`);
		  config[param_name] = param_value;
        }
		restoreConfig(config)
      });
	}
  });

function restoreConfig(config) {
  //console.log('Restoring config');
  document.getElementById("robot_model").value = "CUSTOM";
  for (const key in config) {
    //console.log(key);
    document.getElementById(key).value = config[key];
  }
}
</script>
  <script>
  function show(id, enable) {
	var x = document.getElementById(id);
    //console.log(id, enable, x.style.display);
	if (enable && x.style.display === "none") {
      x.style.display = "";
	} else {
	  if (!enable && x.style.display !== "none") {
        x.style.display = "none";
	  }
    }
  }
  function showToggle(id) {
	var x = document.getElementById(id);
    //console.log(id, enable, x.style.display);
	if (x.style.display === "none") {
      x.style.display = "";
	  return false;
	} else {
	  if (x.style.display !== "none") {
        x.style.display = "none";
		return true;
	  }
    }
  }
  function toggleAdvancedMotorProps() {
    var is_visible = showToggle('motor_advanced_div');
	var x = document.getElementById('motor_model_label');
	if (is_visible) {
	  x.innerHTML = "Motor Model &#9205";
	} else {
	  x.innerHTML = "Motor Model &#9207";
	}
  }
  function populateProps(id, select) {
    idx = select.selectedIndex;
	is_custom = (idx == select.length - 1);
    show(id, is_custom);
	if (id === 'robot_model_div' && !is_custom) {
	  const robot_model_name = ["MAKERSPET_LOKI", "MAKERSPET_FIDO", "MAKERSPET_SNOOPY", "CUSTOM_MODEL"];
      const base_dia = [204.2, 254.2, 300.0];
      const wheel_base = [159.063, 214.322, 262.794];
	  const max_wheel_accel = [2.0, 2.0, 2.0];
	  
	  document.getElementById('robot_model_name').value = robot_model_name[idx];
	  document.getElementById('base_dia').value = base_dia[idx];
	  document.getElementById('wheel_base').value = wheel_base[idx];
	  document.getElementById('max_wheel_accel').value = max_wheel_accel[idx];
	} else if (id === 'motor_model_div' && !is_custom) {
      const motor_max_rpm = [200, 245, 260, 408, 450, 280];
      const wheel_ppr = [270, 630, 204, 127.8, 120, 234.3];
      const motor_voltage = [24, 24, 24, 24, 24, 12];
      const motor_driver_type = ['PWM_CW', 'PWM_CW', 'PWM_CW', 'PWM_CW', 'PWM_CW', 'IN1_IN2_TB6612FNG'];
      const motor_encoder_type = ['FG', 'FG', 'FG', 'FG', 'FG', 'ENCA_ENCB_QUAD'];

	  document.getElementById('motor_max_rpm').value = motor_max_rpm[idx];
	  document.getElementById('wheel_ppr').value = wheel_ppr[idx];
	  document.getElementById('motor_voltage').value = motor_voltage[idx];
	  document.getElementById('motor_driver_type').value = motor_driver[idx];
	  document.getElementById('motor_encoder_type').value = motor_encoder_type[idx];
	}
  }
  </script>
</head>
<body>
  <div class="topnav">
    <h1>Kaia.ai Robot Configurator</h1>
  </div>
  <div class="container">
    <form action="/" method="POST">
      <fieldset>
	  <legend>Network</legend>
	  <div class="row">
	    <div class="col-25">
          <label for="ssid">SSID 2.4GHz</label>
		</div>
		<div class="col-75">
          <input type="text" id="ssid" name="ssid" minlength="1" maxlength="32" placeholder="my_2.4GHz_wifi" required>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="pass">WiFi Password</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="password" id="pass" name="pass">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="dest_ip">Local PC IPv4</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" minlength="7" maxlength="15" size="15"
            pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$"
            id="dest_ip" name="dest_ip" placeholder="192.168.1.200" required autocomplete="on">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="dest_port">Local PC Port</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="number" id="dest_port" min="0" max="65535" name="dest_port" value="8888" required inputmode="numeric">
          </div>
        </div>
      </div>
      </fieldset>
      <br>
      <fieldset>
	  <legend>Body</legend>
	  <div class="row">
	    <div class="col-25">
          <label for="robot_model">Robot model</label>
		</div>
		<div class="col-75">
          <select name="robot_model" id="robot_model" required onchange="populateProps('robot_model_div', this);">
              <option value="MAKERSPET_LOKI">MAKERSPET_LOKI</option>
              <option value="MAKERSPET_FIDO">MAKERSPET_FIDO</option>
              <option value="MAKERSPET_SNOOPY">MAKERSPET_SNOOPY</option>
              <option value="CUSTOM">CUSTOM</option>
            </select>
        </div>
      </div>

      <div id="robot_model_div" style="display:none">
	  <div class="row">
	    <div class="col-25">
          <label for="robot_model_name">Model name</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="robot_model_name" name="robot_model_name" value="MAKERSPET_LOKI" pattern="[0-9a-zA-Z\-_]+" title="Robot model name, alphanumeric with no spaces" required minlength="2">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="base_dia">Base dia., mm</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="base_dia" name="base_dia" value="202" pattern="([0-9]+\.)?[0-9]+" title="Robot body outer diameter in millimeters" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="wheel_base">Wheel base, mm</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="wheel_base" name="wheel_base" value="159.063" pattern="([0-9]+\.)?[0-9]+" title="Distance between tire midpoints in millimeters" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="wheel_dia">Wheel dia., mm</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="wheel_dia" name="wheel_dia" value="67" pattern="([0-9]+\.)?[0-9]+" title="Wheel diameter in millimeters" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="max_wheel_accel">Max acceleration</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="max_wheel_accel" name="max_wheel_accel" value="2.0" pattern="([0-9]+\.)?[0-9]+" title="Maximum wheel-vs-floor acceleration, m2/s" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>
      </div>
      </fieldset>
      <br>
      <fieldset>
	  <legend>Sensors</legend>
	  <div class="row">
	    <div class="col-25">
          <label for="lds_model">LiDAR Model</label>
		</div>
		<div class="col-75">
          <select name="lds_model" id="lds_model" required>
            <option value="YDLIDAR X4">YDLIDAR X4</option>
            <option value="YDLIDAR X3 PRO">YDLIDAR X3 PRO</option>
            <option value="YDLIDAR X3">YDLIDAR X3</option>
            <option value="YDLIDAR X2/X2L">YDLIDAR X2/X2L</option>
            <option value="LDS02RR">Xiaomi Mi LDS02RR</option>
            <option value="NEATO XV11">Neato XV11</option>
            <option value="SLAMTEC RPLIDAR A1">SLAMTEC RPLIDAR A1</option>
            <option value="LDROBOT LD14P">LDROBOT LD14P</option>
            <option value="3IROBOTIX DELTA 2A">3irobotix Delta-2A</option>
            <option value="3IROBOTIX DELTA 2B">3irobotix Delta-2B</option>
            <option value="3IROBOTIX DELTA 2G">3irobotix Delta-2G</option>
            <option value="3IROBOTIX DELTA 2A 115200">3irobotix Delta-2A 115200 baud</option>
            <option value="CAMSENSE X1">Camsense X1</option>
          </select>
        </div>
      </div>
      </fieldset>
      <br>
      <fieldset>
	  <legend>Motors</legend>
	  <div class="row">
	    <div class="col-25">
          <label for="motor_model" class="clickable" id="motor_model_label" onclick="toggleAdvancedMotorProps()">Motor Model &#9205;</label>
		</div>
		<div class="col-75">
          <select name="motor_model" id="motor_model" required onchange="populateProps('motor_model_div', this);">
            <optgroup label="Brushed">
              <option value="12V_280RPM_234.3PPR_TB6612FNG">25GA-370 12V 280RPM 234.3PPR TB6612FNG</option>
            </optgroup>
            <optgroup label="Brushless">
              <option value="24V_200RPM_270PPR_PWM_CW_FG">CHR-GM25-BL2418 24V 200RPM 270PPR</option>
              <option value="24V_245RPM_630PPR_PWM_CW_FG">JGA25-BL2418 24V 245RPM 630PPR</option>
              <option value="24V_260RPM_204PPR_PWM_CW_FG">CHR-GM25-BL2418 24V 260RPM 204PPR</option>
              <option value="24V_408RPM_127.8PPR_PWM_CW_FG">JGA25-BL2418 24V 408RPM 127.8PPR</option>
              <option value="24V_450RPM_120PPR_PWM_CW_FG">CHR-GM25-BL2418 24V 450RPM 120PPR</option>
            </optgroup>
            <option value="CUSTOM">CUSTOM RPM, PPR, Voltage, Driver, Encoder</option>
          </select>
        </div>
      </div>

      <div id="motor_model_div" style="display:none">
	  <div class="row">
	    <div class="col-25">
          <label for="motor_max_rpm">Motor max RPM</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="motor_max_rpm" name="motor_max_rpm" value="200" pattern="([0-9]+\.)?[0-9]+" title="Wheel (motor shaft) maximum RPM" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="wheel_ppr">Wheel PPR</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="text" id="wheel_ppr" name="wheel_ppr" value="270" pattern="([0-9]+\.)?[0-9]+" title="Pulses per revolution. Wheel (motor shaft) PPR = Motor Gear Ratio * Motor Encoder PPR" required maxlength="8" minlength="1" inputmode="decimal">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_voltage">Motor Voltage</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="number" id="motor_voltage" name="motor_voltage" value="24" title="Motor voltage 9..24 volts" required min="9" max="24">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_driver_type">Motor Driver</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <select name="motor_driver_type" id="motor_driver_type" required>
            <option value="IN1_IN2_TB6612FNG">TB6612FNG IN1/IN2 input signals</option>
            <option value="PWM_CW">PWM/CW input signals (including brushless)</option>
          </select>
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_encoder_type">Motor Encoder</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <select name="motor_encoder_type" id="motor_encoder_type" required>
            <option value="ENCA_ENCB_QUAD">Quadrature ENC_A/ENC_B output signals</option>
            <option value="FG">FG output signal (including brushless)</option>
          </select>
          </div>
        </div>
      </div>
      </div>

      <div id="motor_advanced_div" style="display:none">


	  <div class="row">
	    <div class="col-25">
          <label for="motor_direction_reversed">Rotation Direction</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <select name="motor_direction_reversed" id="motor_direction_reversed" required>
            <option value="NONE">Not reversed</option>
            <option value="LEFT">Left motor reversed</option>
            <option value="RIGHT">Right motor reversed</option>
            <option value="BOTH">Both motors reversed</option>
          </select>
          </div>
        </div>
      </div>


	  <div class="row">
	    <div class="col-25">
          <label for="encoder_direction_reversed">Encoder Direction</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <select name="encoder_direction_reversed" id="encoder_direction_reversed" required>
            <option value="NONE">Not reversed</option>
            <option value="LEFT">Left motor encoder reversed</option>
            <option value="RIGHT">Right motor encoder reversed</option>
            <option value="BOTH">Both motor encoders reversed</option>
          </select>
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_pid_kp">PID Kp</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="number" id="motor_pid_kp" name="motor_pid_kp" value="0.001" required inputmode="numeric">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_pid_ki">PID Ki</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="number" id="motor_pid_ki" name="motor_pid_ki" value="0.001" required inputmode="numeric">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_pid_kd">PID Kd</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <input type="number" id="motor_pid_kd" name="motor_pid_kd" value="0" required inputmode="numeric">
          </div>
        </div>
      </div>

	  <div class="row">
	    <div class="col-25">
          <label for="motor_pid_mode">PID Mode</label>
		</div>
		<div class="col-75">
          <div class="sub_input">
          <select name="motor_pid_mode" id="motor_pid_mode" required>
            <option value="ON_MEASUREMENT">On Measurement</option>
            <option value="ON_ERROR">On Error</option>
          </select>
          </div>
        </div>
      </div>

	  </div>

      </fieldset>
      <br>
      <div class="row">
		<center>
        <input type="reset" id="reset" value="Reset">
        <input type ="submit" value="Configure and Connect">
        </center>
      </div>
    </form>
  </div>
</body>
</html>
